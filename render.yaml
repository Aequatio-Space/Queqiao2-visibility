# Render Blueprint — 交互式地平线掩码可视化工具
# 用法：在 Render Dashboard 用 "Blueprint" 创建，或手动新建 Web Service
# 并指向本仓库根目录。
#
# 注意：
# - DEM 使用仓库内置的压缩子集（ldem_87s_5mpp_shackleton_50km_25m.tif，
#   52 MB，随仓库分发），无需持久盘，开箱即用。
# - 如需更高精度 DEM（完整 3.2 GB 版本），可挂载 Disk 并设置
#   DEM_PATH=/opt/data/ldem_87s_5mpp.tif。
# - 访问统计 CSV 默认写入实例临时文件系统（重启丢失）；如需持久化，
#   挂载 Disk 并设置 VIEWER_STATS_DIR=/opt/data/stats。
# - SPICE 内核已随仓库提交（core/environment/data/），默认路径即可。
services:
  - type: web
    name: queqiao2-visibility
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn viewer.server:app --bind 0.0.0.0:$PORT --workers 1 --threads 1 --timeout 300
    envVars:
      - key: PORT
        value: 8000